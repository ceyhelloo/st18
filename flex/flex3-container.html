<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex3-container</title>
  <link rel="stylesheet" href="../reset.css">
  <!-- 플랙스 컨테이너 속성 실습을 위해서
   아이템의 확장x, 축소x -->
  <!-- 
  1. flex 선언 container
  2. flex의 방향을 결정 container
  3. 아이템의 축소/확장을 결정 item
  4. 아이템의 크기결정 item
  5. 아이템의 줄바꿈을 결정 container
  6. 여백관리 gap container margin item
  7. 정렬 container / item, margin
  -->
  <style>
    .wrap{margin: 50px;}
    .container{
      /* width:auto; */
      background-color: #fcc;

    }
    .item{
      border: 1px solid #000;
    }
    .flex{
      width: 300px;
      height: 300px;
      /* 1. flex 컨테이너 선언 ; 단이 될 요소의 부모 */
      display: flex;
      /* 2. flex의 방향을 결정 container 
      주축,교차축 결정 */
      flex-direction: row;
       /* 5. flex-wrap 플렉스 컨테이너 안에서 flex아이템의 합이 플렉스 컨테이너 보다 클 경우 줄바꿈 flex-direction*/
       flex-wrap: wrap;
       /* 6. 여백관리 gap container margin item 
       gap, justiy*/
       /* 7. 정렬 container / item, margin */
       column-gap: 1rem;
       row-gap: 10px;
       /* 7-1 주축의 정렬*/
       justify-content: start;
       /* 7-2 교차축의 정렬 */
       /* 7-2-1 여러줄의 정렬 align-conetent */
       /* 7-2-2 한줄 정렬 align-items */
       /* 플렉스 컨테이너의 교차축크기의 맞춰서 늘어나라 */
       align-content: start;

    }
    .flex .item{
      /*  3. 아이템의 축소/확장을 결정 item */
      flex-grow: 0;
      flex-shrink: 0;
      width: 80px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- .container>.item*4>{item$} -->
    <div class="container flex">
      <div class="item">item1</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>
  </div>
</body>
</html>
