<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex1 수직 수평 가운데 정렬</title>
  <link rel="stylesheet" href="../reset.css">
  <style>
    .visual-section{
      display: flex;
      background-color: #ffc;
      /* viewport를 가득 채운 visual-section 크기 */
      box-sizing: border-box;
      width: 100%; /* 스크롤바를 제외한 크기 */
      height: 100vh;
      /* 2. 방향 flex-direction:row; */
      /* 7. 정렬 */
      justify-content: flex-end;
      align-items: flex-end;
      background-image: url(../css/이미지관련/picture/img/background-test.jpg);
      background-repeat: no-repeat;
      background-position: 0 0;
      background-size: auto 150%;
    }
      .visual-section .text-wrap{
        background-color: #cff;
        flex:none;
        width: 50%;
        min-width: 300px;
        max-width: 500px;
        box-sizing: border-box;
        padding: 1rem 2rem;
        margin-right: 100px;
        margin-bottom: 100px;
      }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="visual-section">
      <div class="text-wrap">
        <div class="title">title</div>
        <div class="desc">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Tempore nesciunt perferendis ipsum velit autem quia dolore obcaecati tenetur perspiciatis ad?</div>
      </div>
    </div>
  </div>
</body>
</html>
